
name: Build Baklol Dialer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find project
        run: |
          find . -maxdepth 4 \
            \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) \
            -print
            
          
