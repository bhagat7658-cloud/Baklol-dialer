name: Build Baklol Dialer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Find Android project
        run: |
          find . -maxdepth 5 \
            \( -name gradlew -o -name settings.gradle \
            -o -name settings.gradle.kts \) -print
