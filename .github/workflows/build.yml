
name: Build Baklol Dialer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: List project files
        run: |
          find . -maxdepth 5 -type f | head -200
          
